<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Debt Payoff Manager Invite</title>
    <meta
      name="description"
      content="Open this partner sharing invite in Debt Payoff Manager."
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f5f4;
        color: #1a1a1a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #404943;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open your invite in Debt Payoff Manager</h1>
      <p>
        If the app is installed, this link opens the shared payoff plan
        automatically. If it does not open, ask the plan owner to resend the
        invite after you install the app.
      </p>
    </main>
  </body>
</html>
