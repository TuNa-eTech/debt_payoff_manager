name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: '3.38.3'

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Lint & Format  (ubuntu — rẻ & nhanh)
  # ─────────────────────────────────────────────────
  analyze:
    name: Lint & Format
    runs-on: ubuntu-latest       # ✅ Đổi từ macos-latest → tiết kiệm 10× credit
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (lint)
        run: flutter analyze --no-fatal-infos

  # ─────────────────────────────────────────────────
  # Job 2: Unit + Engine tests + Coverage gate
  #         (ubuntu — chạy song song với analyze,
  #          nhưng chờ analyze pass trước)
  # ─────────────────────────────────────────────────
  unit-and-engine:
    name: Unit + Engine tests
    runs-on: ubuntu-latest       # ✅ Đổi từ macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ✅ Chạy build_runner MỘT LẦN duy nhất tại đây
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ✅ Verify generated files ngay đây (thay cho job codegen riêng)
      - name: Verify generated files committed
        run: |
          if [[ -n "$(git status --porcelain '*.g.dart' '*.freezed.dart')" ]]; then
            echo "Generated files out of date. Run build_runner locally and commit."
            git status --porcelain '*.g.dart' '*.freezed.dart'
            exit 1
          fi

      - name: Test (engine + unit)
        run: flutter test --coverage --exclude-tags integration

      # ✅ Coverage gate tích hợp trực tiếp — không cần job riêng
      - name: Verify engine coverage ≥ 95%
        run: |
          ENGINE_COV=$(lcov --extract coverage/lcov.info 'lib/engine/*' \
            --rc lcov_branch_coverage=1 2>/dev/null \
            | tail -3 | grep lines | awk '{print $2}' | tr -d '%')
          echo "Engine coverage: ${ENGINE_COV}%"
          if (( $(echo "$ENGINE_COV < 95" | bc -l) )); then
            echo "❌ Engine coverage ${ENGINE_COV}% below 95% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      # ✅ Upload generated files để build jobs tái sử dụng
      - name: Upload generated dart files
        uses: actions/upload-artifact@v4
        with:
          name: generated-dart-files
          path: |
            **/*.g.dart
            **/*.freezed.dart
          retention-days: 1

  # ─────────────────────────────────────────────────
  # Job 3 & 4: Build — chạy song song sau tests pass
  # ─────────────────────────────────────────────────
  build-android:
    name: Build Android (unsigned)
    runs-on: ubuntu-latest       # ✅ Đổi từ macos-latest — Android KHÔNG cần macOS
    needs: [analyze, unit-and-engine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Cache Gradle để tránh tải lại dependencies mỗi lần
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ✅ Tải generated files từ artifact — KHÔNG chạy build_runner lại
      - name: Download generated dart files
        uses: actions/download-artifact@v4
        with:
          name: generated-dart-files

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest        # ✅ Giữ macOS vì iOS bắt buộc cần Xcode
    needs: [analyze, unit-and-engine]
    steps:
      - uses: actions/checkout@v4

      # ✅ Cache CocoaPods để tránh resolve lại Pods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ✅ Tải generated files từ artifact — KHÔNG chạy build_runner lại
      - name: Download generated dart files
        uses: actions/download-artifact@v4
        with:
          name: generated-dart-files

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

  # NOTE: Job codegen và coverage-gate đã bị xóa:
  #   - codegen: Đã merge vào unit-and-engine
  #   - coverage-gate: Đã merge vào unit-and-engine
  #
  # Firestore rules: (TODO – re-add when Phase 7+ is reached)
  #   Requires: firestore.rules, test/firestore-rules/, firebase.json
